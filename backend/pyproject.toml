[project]
name = "agentready"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "beautifulsoup4>=4.12", "dnspython>=2.6", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
runner = ["anthropic>=0.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: needs the network (and an API key for some); skipped unless AGENTREADY_LIVE=1"]
